# =====================================================================
# FIS Hackathon 2026 · API Gateway (nginx:alpine) · SPEC §8
# Archivo COMPLETO (con events{} y http{}): montar como /etc/nginx/nginx.conf
#
# Cambio clave respecto a la versión anterior:
#   - LECTURAS (GET/HEAD/OPTIONS): límite generoso 30 r/s, ráfaga 60 -> el dashboard
#     hace polling cada segundo y NUNCA debe recibir un 429 durante la demo.
#   - ESCRITURAS (POST/PATCH/PUT/DELETE): 5 r/s, ráfaga 10 -> frena la fuerza bruta
#     contra /api/payments/{id}/rotation-authorization (la historia del ataque).
#   - El 429 sale en JSON (problem+json), no en HTML: el frontend lo puede pintar.
# =====================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;                       # no anunciar la versión de nginx

    # Log en JSON: una línea por petición, fácil de enseñar y de filtrar
    log_format json_log escape=json
        '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
        '"uri":"$request_uri","status":$status,"rt":$request_time,"limited":"$limit_req_status"}';
    access_log /var/log/nginx/access.log json_log;

    # WebSocket del hot-reload de Vite
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Clave del límite de ESCRITURA: vacía para lecturas => nginx no las cuenta en esa zona
    map $request_method $api_write_key {
        default  $binary_remote_addr;
        GET      "";
        HEAD     "";
        OPTIONS  "";
    }

    limit_req_zone $binary_remote_addr zone=api_read:10m  rate=30r/s;
    limit_req_zone $api_write_key      zone=api_write:10m rate=5r/s;
    limit_req_status 429;

    upstream backend_upstream  { server backend:8080; }    # mismos nombres que la config anterior
    upstream frontend_upstream { server frontend:5173; }

    server {
        listen 80;
        client_max_body_size 64k;            # ninguna petición legítima de la demo pesa más

        # Cabeceras de seguridad (se heredan en las locations que no definen add_header propio)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # ---------------- API ----------------
        location /api/ {
            limit_req zone=api_read  burst=60 nodelay;
            limit_req zone=api_write burst=10 nodelay;
            error_page 429 = @rate_limited;

            proxy_pass http://backend_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        location @rate_limited {
            default_type application/problem+json;
            add_header Retry-After 1 always;
            return 429 '{"type":"about:blank","title":"Too Many Requests","status":429,"code":"RATE_LIMITED","detail":"Too many requests from this client. Slow down."}';
        }

        # ---------------- Swagger / OpenAPI ----------------
        location /swagger-ui/ {
            proxy_pass http://backend_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;
        }

        location /v3/api-docs {
            proxy_pass http://backend_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;
        }

        # ---------------- Frontend (Vite) ----------------
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
        }
    }
}
