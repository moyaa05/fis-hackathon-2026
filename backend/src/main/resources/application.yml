server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: FIS-Core-Engine
  threads:
    virtual:
      enabled: true # Activa Virtual Threads de Java 21 para alta concurrencia
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fis_ledger}
    username: ${SPRING_DATASOURCE_USERNAME:fis_user}
    password: ${SPRING_DATASOURCE_PASSWORD:fis_password}
  jpa:
    hibernate:
      ddl-auto: update # Crea y actualiza tablas automáticamente sin migraciones
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
