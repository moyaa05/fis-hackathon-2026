# Puertos: por defecto solo escuchan en este portatil (127.0.0.1). En la WiFi del recinto nadie mas puede
# llamar a /api/demo/reset ni a Postgres. Para abrirlos a la red local (otro equipo entra por IP):
#   BIND_ADDR=0.0.0.0 docker compose up -d
# restart: unless-stopped -> si Docker o un contenedor se cae, vuelve a levantarse solo.
services:
  db:
    image: postgres:16-alpine
    container_name: fis-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fis_user
      POSTGRES_PASSWORD: fis_password
      POSTGRES_DB: fis_ledger
    ports:
      - "${BIND_ADDR:-127.0.0.1}:15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fis_user -d fis_ledger"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: fis-backend
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/fis_ledger
      SPRING_DATASOURCE_USERNAME: fis_user
      SPRING_DATASOURCE_PASSWORD: fis_password
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: fis-frontend
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:5173:5173"
    depends_on:
      - backend

  gateway:
    image: nginx:alpine
    container_name: fis-gateway
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:18080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
